# Dependabot: propone pull requests para actualizar dependencias.
# Cada PR pasa por la CI y la protección de main: nada se fusiona solo.
# Solo se activa cuando este archivo llega a la rama por defecto (main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      # Las actualizaciones menores y de parches, juntas en un solo PR
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
